function compileTrack(tr){
  if(tr._c)return tr._c;
  const out={};
  for(const k of['lead','arp','bass','drum']){
    const map=[];let p=0;
    for(const[n,d]of tr[k]){map[p]={n,d};p+=d}
    out[k]={map,len:p};
  }
  return(tr._c=out);
}
function playTone(ac,t0,f,dur,ty,vol){
  if(!f)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.007);
  g.gain.setValueAtTime(vol*.82,t0+Math.max(.012,dur*.72));
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur*.96);
  o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+dur);
}
function playDrum(ac,t0,k){
  if(k=='K'){
    const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
    o.frequency.setValueAtTime(145,t0);o.frequency.exponentialRampToValueAtTime(42,t0+.085);
    g.gain.setValueAtTime(.18,t0);g.gain.exponentialRampToValueAtTime(.001,t0+.095);
    o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.1);
  }else if((k=='S'||k=='H')&&noiseBuf){
    const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseBuf;fl.type=k=='S'?'bandpass':'highpass';fl.frequency.value=k=='S'?1400:6500;
    const d=k=='S'?.1:.032;
    g.gain.setValueAtTime(k=='S'?.095:.042,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
    s.connect(fl);fl.connect(g);g.connect(ac.destination);s.start(t0);s.stop(t0+d);
  }
}

let bgmTimer=null,bgmCur='',bgmStep=0,bgmNext=0;
function bgmStop(){if(bgmTimer){clearInterval(bgmTimer);bgmTimer=null}}
function bgmTick(){
  if(!S.snd||document.hidden){bgmStop();return}
  const ac=ensureAC();if(ac.state!=='running')return;
  const tr=BGM[bgmCur];if(!tr)return;
  const c=compileTrack(tr),sd=60/tr.bpm/4;
  if(bgmNext<ac.currentTime-.15)bgmNext=ac.currentTime+.03;
  while(bgmNext<ac.currentTime+.12){
    const L=c.lead.map[bgmStep%c.lead.len],A=c.arp.map[bgmStep%c.arp.len],B=c.bass.map[bgmStep%c.bass.len],D=c.drum.map[bgmStep%c.drum.len];
    if(L)playTone(ac,bgmNext,n2f(L.n),L.d*sd,'square',.052);
    if(A)playTone(ac,bgmNext,n2f(A.n),A.d*sd,'square',.026);
    if(B)playTone(ac,bgmNext,n2f(B.n),B.d*sd,'triangle',.085);
    if(D)playDrum(ac,bgmNext,D.n);
    bgmNext+=sd;bgmStep++;
  }
}
function bgmSync(){
  if(!S.snd||document.hidden||st=='pause'||st=='over'||st=='done'){bgmStop();return}
  const want=st=='play'?'lv'+lv:st=='cut'?'cut':'menu';
  if(bgmCur!==want){bgmCur=want;bgmStep=0;bgmNext=0}
  if(!bgmTimer){
    try{const ac=ensureAC();bgmNext=ac.currentTime+.04}catch(e){}
    bgmTimer=setInterval(bgmTick,25);
  }
}
function jingle(kind){
  if(!S.snd)return;
  try{
    const ac=ensureAC(),t0=ac.currentTime+.03;
    const seq=kind=='win'?[['C5',.1],['E5',.1],['G5',.1],['C6',.16],['G5',.1],['C6',.32]]:[['C5',.13],['G4',.13],['E4',.15],['A4',.11],['B4',.11],['A4',.11],['Ab4',.12],['Bb4',.12],['Ab4',.12],['G4',.35]];
    let off=0;for(const[n,d]of seq){playTone(ac,t0+off,n2f(n),d,'square',.065);off+=d}
  }catch(e){}
}

const addScore=n=>{S.score+=n;S.total+=n;if(S.score>S.best)S.best=S.score};
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const solidAt=(x,y)=>solids.some(s=>x>=s.x&&x<s.x+s.w&&y>=s.y&&y<s.y+s.h);

function build(i){
  lv=i;const d=L[i];solids=[];coins=[];en=[];boss=null;lvCoins=0;cam=0;t=0;
  let x=0;const gs=[...d.g].sort((a,b)=>a[0]-b[0]);
  for(const[gx,gw]of gs){if(gx>x)solids.push({x:x*T,y:12*T,w:(gx-x)*T,h:2*T,g:1});
    for(let k=0;k<3;k++)coins.push({x:(gx+gw/2)*T-8+(k-1)*28,y:12*T-110+Math.abs(k-1)*22});x=gx+gw}
  solids.push({x:x*T,y:12*T,w:(d.len-x)*T,h:2*T,g:1});
  solids.filter(s=>s.g).forEach(s=>{for(let k=s.x+4*T;k<s.x+s.w-T;k+=7*T)coins.push({x:k+8,y:12*T-60})});
  d.p.forEach(([px,py,pw])=>{solids.push({x:px*T,y:py*T,w:pw*T,h:T});for(let k=0;k<pw;k++)coins.push({x:(px+k)*T+8,y:py*T-26})});
  d.e.forEach((ex,k)=>en.push({x:ex*T,y:0,w:k%5==4?38:28,h:k%5==4?22:28,sh:k%5,vx:0,vy:0,dir:-1,lab:d.lab[k%d.lab.length],col:ecol[k%5],sp:d.sp+(k%3)*8,dt:0}));
  if(d.boss){boss={x:(d.bx||58)*T,y:0,w:64,h:64,vx:0,vy:0,dir:-1,hp:3,big:1,inv:0,jt:2,a0:(d.a0||48)*T,a1:(d.a1||66)*T,dt:0,lab:'=',pi:d.boss==2,dc:3,ds:0};en.push(boss)}
  P={x:2*T,y:10*T,w:22,h:30,vx:0,vy:0,face:1,inv:1.5,cy:0,jb:0,jp:0,cp:{x:2*T,y:10*T}};
}

function move(o,dt){
  o.hitx=false;o.x+=o.vx*dt;
  for(const s of solids)if(ov(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.hitx=true}
  o.y+=o.vy*dt;o.on=false;
  for(const s of solids)if(ov(o,s)){if(o.vy>0){o.y=s.y-o.h;o.on=true;o.floor=s}else o.y=s.y+s.h;o.vy=0}
}
function hurt(){
  lives--;sfx(120,.4,'sawtooth');
  if(lives<=0){st='over';save();bgmSync();jingle('over');ui(`<h2>GAME OVER</h2><p>Skor: ${S.score}</p><div class=row><button class=g data-a=retry>Coba Lagi</button><button data-a=menu>Menu</button></div>`);return}
  P.x=P.cp.x;P.y=P.cp.y;P.vx=P.vy=0;P.inv=2;
}

function drawWings(c,wk){
  const fl=Math.round(wk*1.5);
  // Sayap belakang (kiri sedikit lebih atas)
  c.fillStyle='#1b1b1b';
  c.fillRect(-17,6-fl,11,5);c.fillRect(-19,9-fl,12,5);c.fillRect(-16,14-fl,9,4);c.fillRect(-13,18-fl,6,3);
  c.fillStyle='#bfe9ff';
  c.fillRect(-16,7-fl,9,3);c.fillRect(-18,10-fl,10,3);c.fillRect(-15,14-fl,7,3);
  c.fillStyle='#ffffff';
  c.fillRect(-15,7-fl,7,2);c.fillRect(-17,10-fl,8,2);c.fillRect(-14,14-fl,5,2);c.fillRect(-12,18-fl,4,2);
}
function drawHat(c,cx,by){
  // Topi petualang/pesulap klasik biru-emas dengan pinggiran (brim)
  c.fillStyle='#1b1b1b';
  c.fillRect(cx-9,by-3,18,3); // brim outline
  c.fillRect(cx-7,by-8,14,6); // crown outline
  c.fillStyle='#2980b9';
  c.fillRect(cx-8,by-2,16,1); // brim
  c.fillRect(cx-6,by-7,12,5); // crown
  c.fillStyle='#54a0ff';
  c.fillRect(cx-5,by-7,4,3); // highlight
  c.fillStyle='#ffd93b';
  c.fillRect(cx-6,by-4,12,2); // pita emas
}
function drawTie(c,tx,ty){
  // Dasi merah klasik di kerah/dada
  c.fillStyle='#1b1b1b';
  c.fillRect(tx-2,ty,5,3);
  c.fillRect(tx-1,ty+3,3,5);
  c.fillRect(tx,ty+8,1,1);
  c.fillStyle='#e63946';
  c.fillRect(tx-1,ty+1,3,2);
  c.fillRect(tx,ty+3,1,5);
  c.fillStyle='#ff7675';
  c.fillRect(tx,ty+1,1,1);
}
function drawBurger(c,cx,by){
  // Roti bawah
  c.fillStyle='#1b1b1b';c.fillRect(cx-8,by-3,16,3);
  c.fillStyle='#d9822b';c.fillRect(cx-7,by-2,14,2);
  // Daging patty
  c.fillStyle='#1b1b1b';c.fillRect(cx-9,by-5,18,3);
  c.fillStyle='#5c2c16';c.fillRect(cx-8,by-4,16,2);
  // Keju meleleh
  c.fillStyle='#ffd93b';c.fillRect(cx-8,by-5,16,1);c.fillRect(cx-5,by-4,2,2);c.fillRect(cx+3,by-4,2,1);
  // Selada hijau & tomat
  c.fillStyle='#4cd137';c.fillRect(cx-8,by-6,16,1);
  c.fillStyle='#e84118';c.fillRect(cx-6,by-7,12,1);
  // Roti atas kubah + biji wijen
  c.fillStyle='#1b1b1b';c.fillRect(cx-8,by-10,16,3);c.fillRect(cx-6,by-11,12,1);
  c.fillStyle='#f39c12';c.fillRect(cx-7,by-9,14,2);c.fillRect(cx-5,by-10,10,1);
  c.fillStyle='#fff6d6';c.fillRect(cx-3,by-9,1,1);c.fillRect(cx+1,by-10,1,1);c.fillRect(cx+4,by-9,1,1);
}
function drawWatch(c,wx,wy){
  // Tali jam hitam + bezel emas + layar biru menyala
  c.fillStyle='#1b1b1b';c.fillRect(wx-1,wy-1,5,5);
  c.fillStyle='#ffd93b';c.fillRect(wx,wy,3,3);
  c.fillStyle='#0984e3';c.fillRect(wx+1,wy+1,1,1);
}

const TP=prof(),BP=prof(),PT=[];
for(let i=0;i<90;i++)PT.push([Math.floor(rnd()*NC)*PS,80+Math.floor(rnd()*((CM-160)/PS))*PS,(2+Math.floor(rnd()*5))*PS,(1+Math.floor(rnd()*2))*PS,rnd()<.5?'#dcefff':'#c3e0f7']);
const CP=[['....XXXX....','..XXXXXXXX..','.XXXXXXXXXX.','XXXXXXXXXXXX','.LLLLLLLLLL.'],
 ['......XXXX......','..XXXXXXXXXX....','..XXXXXXXXXXXX..','XXXXXXXXXXXXXXXX','.LLLLLLLLLLLLLL.'],
 ['..XXXX..','.XXXXXX.','XXXXXXXX','.LLLLLL.']];
const PF=[];for(let i=0;i<14;i++)PF.push({x:Math.round((-20+rnd()*(W-60))/PS)*PS,o:40+rnd()*200,p:i%3,s:rnd()<.5?1:2,d:i<7?-1:1});
function pcl(x,y,p,s){const cs=PS*s,R=CP[p];x=Math.round(x/PS)*PS;y=Math.round(y/PS)*PS;
  for(let pass=0;pass<2;pass++)for(let r=0;r<R.length;r++)for(let c=0;c<R[r].length;c++){const q=R[r][c];if(q=='.')continue;
    if(!pass){XT.fillStyle=OL;XT.fillRect(x+c*cs-4,y+r*cs-4,cs+8,cs+8)}else{XT.fillStyle=q=='L'?'#bfdcf2':'#fff';XT.fillRect(x+c*cs,y+r*cs,cs,cs)}}}
function drawTr(){
  const y=tr.y;XT.clearRect(0,0,W,H);
  const te=c=>y+64-TP[c],be=c=>y+CM-64+BP[c];
  XT.fillStyle='#fff';for(let c=0;c<NC;c++){const a=Math.max(0,te(c)),b=Math.min(H,be(c));if(b>a)XT.fillRect(c*PS,a,PS,b-a)}
  for(const p of PT){const py=y+p[1];if(py>H||py+p[3]<0)continue;XT.fillStyle=p[4];XT.fillRect(p[0],py,p[2],p[3])}
  XT.fillStyle='#bfdcf2';for(let c=0;c<NC;c++)XT.fillRect(c*PS,be(c)-PS,PS,PS);
  XT.fillStyle=OL;
  for(let c=0;c<NC;c++){const x=c*PS,t=te(c),b=be(c);
    XT.fillRect(x,t-4,PS,4);XT.fillRect(x,b,PS,4);
    if(c>0){const tl=te(c-1),bl=be(c-1);if(tl>t)XT.fillRect(x,t,4,tl-t);if(bl<b)XT.fillRect(x,bl,4,b-bl)}
    if(c<NC-1){const tn=te(c+1),bn=be(c+1);if(tn>t)XT.fillRect(x+PS-4,t,4,tn-t);if(bn<b)XT.fillRect(x+PS-4,bn,4,b-bn)}}
  for(const f of PF)pcl(f.x,f.d<0?y-f.o:y+CM+f.o,f.p,f.s)
}
function trans(cb){if(tr)return;tr={t:0,f:0,y:Y0,cb};CT.style.pointerEvents='auto';sfx(330,.3,'triangle')}
function stepTr(dt){
  if(!tr)return;tr.t+=dt;const a=TIN+THD,b=a+TOUT;let y;
  if(tr.t<TIN)y=Y0+(YH-Y0)*es(tr.t/TIN);

}
